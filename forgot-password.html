<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Blizzo Designers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23121212'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%231E6F46' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-card__mark">Blizzo <span>Designers</span></a>
    <h1>Reset your password</h1>
    <p class="auth-card__sub">Enter your account email and we'll send you a link to set a new password.</p>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <p class="auth-card__status" id="forgotStatus" role="status" aria-live="polite"></p>

      <button type="submit" class="btn btn--primary btn--wide auth-card__submit" id="forgotSubmit">Send reset link</button>
    </form>

    <p class="auth-card__foot">Remembered it? <a href="login.html">Back to log in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  "use strict";

  var form = document.getElementById("forgotForm");
  var statusEl = document.getElementById("forgotStatus");
  var submitBtn = document.getElementById("forgotSubmit");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    statusEl.removeAttribute("data-state");

    if (!window.blizzoSupabase) {
      statusEl.textContent = "Supabase isn't configured yet — add your project URL and key to supabase-config.js.";
      statusEl.setAttribute("data-state", "error");
      return;
    }

    var email = document.getElementById("email").value.trim();
    submitBtn.disabled = true;
    statusEl.textContent = "Sending…";

    var resetUrl = window.location.origin + window.location.pathname.replace(/forgot-password\.html$/, "reset-password.html");

    var result = await window.blizzoSupabase.auth.resetPasswordForEmail(email, {
      redirectTo: resetUrl
    });

    submitBtn.disabled = false;

    if (result.error) {
      statusEl.textContent = result.error.message || "Couldn't send the reset email.";
      statusEl.setAttribute("data-state", "error");
      return;
    }

    statusEl.textContent = "If an account exists for that email, a reset link is on its way. Check your inbox.";
    statusEl.setAttribute("data-state", "ok");
    form.reset();
  });
})();
</script>
</body>
</html>
