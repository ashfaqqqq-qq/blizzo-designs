<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Blizzo Designers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23121212'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%231E6F46' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-card__mark">Blizzo <span>Designers</span></a>
    <h1>Set a new password</h1>
    <p class="auth-card__sub" id="introText">Choose a new password for your account.</p>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password">
      </div>

      <p class="auth-card__status" id="resetStatus" role="status" aria-live="polite"></p>

      <button type="submit" class="btn btn--primary btn--wide auth-card__submit" id="resetSubmit">Update password</button>
    </form>

    <p class="auth-card__foot"><a href="login.html">Back to log in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  "use strict";

  var form = document.getElementById("resetForm");
  var statusEl = document.getElementById("resetStatus");
  var submitBtn = document.getElementById("resetSubmit");
  var introText = document.getElementById("introText");
  var ready = false;

  // The reset link Supabase emails carries a recovery token in the URL.
  // supabase-js reads it automatically on load and fires this event once
  // the recovery session is active — only then is updateUser() safe to call.
  if (window.blizzoSupabase) {
    window.blizzoSupabase.auth.onAuthStateChange(function (event) {
      if (event === "PASSWORD_RECOVERY") {
        ready = true;
        statusEl.textContent = "";
        statusEl.removeAttribute("data-state");
      }
    });

    // Fallback: some browsers/flows already have the session set by the
    // time this script runs, before onAuthStateChange has a chance to fire.
    window.blizzoSupabase.auth.getSession().then(function (res) {
      if (res.data && res.data.session) ready = true;
    });
  }

  setTimeout(function () {
    if (!ready) {
      introText.textContent = "This page only works when opened from the password reset email link.";
      statusEl.textContent = "No active reset session was found. Request a new link from the forgot-password page.";
      statusEl.setAttribute("data-state", "error");
    }
  }, 2500);

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    statusEl.removeAttribute("data-state");

    if (!window.blizzoSupabase) {
      statusEl.textContent = "Supabase isn't configured yet — add your project URL and key to supabase-config.js.";
      statusEl.setAttribute("data-state", "error");
      return;
    }

    var password = document.getElementById("password").value;
    var confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      statusEl.textContent = "Those passwords don't match.";
      statusEl.setAttribute("data-state", "error");
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = "Updating…";

    var result = await window.blizzoSupabase.auth.updateUser({ password: password });

    submitBtn.disabled = false;

    if (result.error) {
      statusEl.textContent = result.error.message || "Couldn't update the password. The reset link may have expired — request a new one.";
      statusEl.setAttribute("data-state", "error");
      return;
    }

    statusEl.textContent = "Password updated — redirecting to log in…";
    statusEl.setAttribute("data-state", "ok");
    setTimeout(function () {
      window.location.href = "login.html";
    }, 1200);
  });
})();
</script>
</body>
</html>
