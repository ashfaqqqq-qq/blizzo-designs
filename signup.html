<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an account — Blizzo Designers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%23100C18'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%239B4DFF' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-card__mark">Blizzo <span>Designers</span></a>

    <!-- ---------- STEP 1: details ---------- -->
    <div class="step is-active" id="stepDetails">
      <h1>Create an account</h1>
      <p class="auth-card__sub">For clients we're building a site for. Once you're in, you'll see your project's status here.</p>

      <button type="button" class="btn--google" id="googleBtn" style="margin-top:24px;">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.97v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.97A9 9 0 0 0 0 9c0 1.45.35 2.83.97 4.03l2.98-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .97 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <div class="auth-divider">or</div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
        </div>

        <p class="auth-card__status" id="signupStatus" role="status" aria-live="polite"></p>

        <button type="submit" class="btn btn--primary btn--wide auth-card__submit" id="signupSubmit">Send verification code</button>
      </form>

      <p class="auth-card__foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>

    <!-- ---------- STEP 2: verify email OTP ---------- -->
    <div class="step" id="stepVerify">
      <button type="button" class="auth-back" id="backBtn">← Back</button>
      <h1>Check your email</h1>
      <p class="auth-card__sub">Enter the 6-digit code we just sent you.</p>
      <p style="margin-top:8px; color:#6B6480; font-size:0.88rem;">Sent to <strong id="otpEmailLabel" style="color:var(--ink); font-weight:700;"></strong></p>

      <form id="otpForm" novalidate>
        <div class="field">
          <div class="otp-boxes" id="otpBoxes">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 6">
          </div>
        </div>

        <p class="auth-card__status" id="otpStatus" role="status" aria-live="polite"></p>

        <button type="submit" class="btn btn--primary btn--wide auth-card__submit" id="otpSubmit">Verify &amp; create account</button>
      </form>

      <p class="resend-row" style="margin-top:16px; font-size:0.88rem; color:#6B6480; text-align:center;">
        Didn't get it? <button type="button" id="resendBtn" style="background:none; border:none; padding:0; color:var(--ink); border-bottom:2px solid var(--purple); font-weight:700; font-size:inherit;">Resend code</button>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  "use strict";

  var stepDetails = document.getElementById("stepDetails");
  var stepVerify = document.getElementById("stepVerify");
  function showStep(step) {
    [stepDetails, stepVerify].forEach(function (s) { s.classList.toggle("is-active", s === step); });
  }

  // ---------- Google sign-in ----------
  document.getElementById("googleBtn").addEventListener("click", async function () {
    if (!window.blizzoSupabase) {
      alert("Supabase isn't configured yet — add your project URL and key to supabase-config.js.");
      return;
    }
    var result = await window.blizzoSignInWithGoogle();
    if (result.error) alert(result.error.message || "Couldn't start Google sign-in.");
  });

  var signupForm = document.getElementById("signupForm");
  var signupStatus = document.getElementById("signupStatus");
  var signupSubmit = document.getElementById("signupSubmit");

  var otp = window.blizzoSetupOtpBoxes(document.getElementById("otpBoxes"));
  var otpForm = document.getElementById("otpForm");
  var otpStatus = document.getElementById("otpStatus");
  var otpSubmit = document.getElementById("otpSubmit");
  var otpEmailLabel = document.getElementById("otpEmailLabel");
  var resendBtn = document.getElementById("resendBtn");
  var backBtn = document.getElementById("backBtn");

  var pendingEmail = "";
  var resendCooldown = 0;
  var resendTimer = null;

  function startResendCooldown() {
    resendCooldown = 30;
    resendBtn.disabled = true;
    resendBtn.textContent = "Resend code (" + resendCooldown + "s)";
    clearInterval(resendTimer);
    resendTimer = setInterval(function () {
      resendCooldown -= 1;
      if (resendCooldown <= 0) {
        clearInterval(resendTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = "Resend code";
      } else {
        resendBtn.textContent = "Resend code (" + resendCooldown + "s)";
      }
    }, 1000);
  }

  backBtn.addEventListener("click", function () { showStep(stepDetails); });

  // ---------- Step 1: create the account, triggering Supabase's OTP email ----------
  signupForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    signupStatus.removeAttribute("data-state");

    if (!window.blizzoSupabase) {
      signupStatus.textContent = "Supabase isn't configured yet — add your project URL and key to supabase-config.js.";
      signupStatus.setAttribute("data-state", "error");
      return;
    }

    var fullName = document.getElementById("fullName").value.trim();
    pendingEmail = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    signupSubmit.disabled = true;
    signupStatus.textContent = "Sending your code…";

    var result = await window.blizzoSupabase.auth.signUp({
      email: pendingEmail,
      password: password,
      options: { data: { full_name: fullName } }
    });

    signupSubmit.disabled = false;

    if (result.error) {
      signupStatus.textContent = result.error.message || "Couldn't create the account.";
      signupStatus.setAttribute("data-state", "error");
      return;
    }

    // If the project has email confirmations turned off, Supabase returns
    // a session immediately — no code needed, skip straight to the dashboard.
    if (result.data.session) {
      window.location.href = "dashboard.html";
      return;
    }

    otpEmailLabel.textContent = pendingEmail;
    otpStatus.textContent = "";
    otpStatus.removeAttribute("data-state");
    otp.clear();
    showStep(stepVerify);
    startResendCooldown();
  });

  // ---------- Step 2: verify the code ----------
  otpForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    otpStatus.removeAttribute("data-state");

    var code = otp.getValue();
    if (code.length !== 6) {
      otpStatus.textContent = "Enter all 6 digits.";
      otpStatus.setAttribute("data-state", "error");
      return;
    }

    otpSubmit.disabled = true;
    otpStatus.textContent = "Verifying…";

    var result = await window.blizzoSupabase.auth.verifyOtp({
      email: pendingEmail,
      token: code,
      type: "signup"
    });

    if (result.error) {
      otpStatus.textContent = result.error.message || "That code didn't work — check it and try again.";
      otpStatus.setAttribute("data-state", "error");
      otpSubmit.disabled = false;
      otp.clear();
      return;
    }

    otpStatus.textContent = "Verified — redirecting…";
    otpStatus.setAttribute("data-state", "ok");
    window.location.href = "dashboard.html";
  });

  // ---------- Resend the code ----------
  resendBtn.addEventListener("click", async function () {
    if (resendBtn.disabled) return;
    otpStatus.textContent = "Resending…";
    otpStatus.removeAttribute("data-state");

    var result = await window.blizzoSupabase.auth.resend({ type: "signup", email: pendingEmail });

    if (result.error) {
      otpStatus.textContent = result.error.message || "Couldn't resend the code.";
      otpStatus.setAttribute("data-state", "error");
      return;
    }

    otpStatus.textContent = "New code sent.";
    otpStatus.setAttribute("data-state", "ok");
    startResendCooldown();
  });
})();
</script>
</body>
</html>
