<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Blizzo Designers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23121212'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%231E6F46' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="topbar__mark">Blizzo <span>Designers</span></a>
  <div class="topbar__right">
    <span class="topbar__user" id="userLabel"></span>
    <button class="btn btn--ghost btn--sm" id="signOutBtn">Sign out</button>
  </div>
</header>

<main class="dash">
  <div class="dash__head">
    <h1>Enquiries</h1>
    <p>Everyone who's filled in the contact form on the site.</p>
  </div>

  <div class="filter-bar" id="filterBar">
    <button data-filter="all" class="is-active">All</button>
    <button data-filter="new">New</button>
    <button data-filter="contacted">Contacted</button>
    <button data-filter="closed">Closed</button>
  </div>

  <div id="enquiryList" class="enquiry-list">
    <p class="dash__empty">Loading enquiries…</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  "use strict";

  var allEnquiries = [];
  var activeFilter = "all";

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    } catch (e) {
      return "";
    }
  }

  function render() {
    var listEl = document.getElementById("enquiryList");
    var items = activeFilter === "all" ? allEnquiries : allEnquiries.filter(function (e) { return e.status === activeFilter; });

    if (!items.length) {
      listEl.innerHTML = '<p class="dash__empty">No enquiries here yet.</p>';
      return;
    }

    listEl.innerHTML = items.map(function (enq) {
      var status = enq.status || "new";
      return (
        '<article class="enquiry-card" data-id="' + enq.id + '">' +
          '<div class="enquiry-card__top">' +
            '<div>' +
              '<p class="enquiry-card__name">' + escapeHtml(enq.name) + '</p>' +
              '<p class="enquiry-card__meta">' +
                escapeHtml(enq.phone) +
                (enq.email ? ' · ' + escapeHtml(enq.email) : '') +
                ' · ' + formatDate(enq.created_at) +
              '</p>' +
            '</div>' +
            '<span class="badge badge--' + status + '">' + escapeHtml(status) + '</span>' +
          '</div>' +
          (enq.message ? '<p class="enquiry-card__msg">' + escapeHtml(enq.message) + '</p>' : '') +
          '<div class="enquiry-card__tags">' +
            (enq.business ? '<span>' + escapeHtml(enq.business) + '</span>' : '') +
            (enq.project_type ? '<span>' + escapeHtml(enq.project_type) + '</span>' : '') +
            (enq.budget ? '<span>' + escapeHtml(enq.budget) + '</span>' : '') +
          '</div>' +
          '<div class="enquiry-card__actions">' +
            '<select class="statusSelect" data-id="' + enq.id + '">' +
              ['new', 'contacted', 'closed'].map(function (s) {
                return '<option value="' + s + '"' + (s === status ? ' selected' : '') + '>' + s + '</option>';
              }).join('') +
            '</select>' +
            '<button class="btn btn--ghost btn--sm deleteBtn" data-id="' + enq.id + '">Delete</button>' +
          '</div>' +
        '</article>'
      );
    }).join("");

    listEl.querySelectorAll(".statusSelect").forEach(function (sel) {
      sel.addEventListener("change", async function () {
        var id = sel.getAttribute("data-id");
        var newStatus = sel.value;
        var res = await window.blizzoSupabase.from("enquiries").update({ status: newStatus }).eq("id", id);
        if (res.error) {
          alert("Couldn't update status: " + res.error.message);
          return;
        }
        allEnquiries = allEnquiries.map(function (e) { return e.id === id ? Object.assign({}, e, { status: newStatus }) : e; });
        render();
      });
    });

    listEl.querySelectorAll(".deleteBtn").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var id = btn.getAttribute("data-id");
        if (!confirm("Delete this enquiry? This can't be undone.")) return;
        var res = await window.blizzoSupabase.from("enquiries").delete().eq("id", id);
        if (res.error) {
          alert("Couldn't delete: " + res.error.message);
          return;
        }
        allEnquiries = allEnquiries.filter(function (e) { return e.id !== id; });
        render();
      });
    });
  }

  document.getElementById("filterBar").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-filter]");
    if (!btn) return;
    activeFilter = btn.getAttribute("data-filter");
    document.querySelectorAll("#filterBar button").forEach(function (b) { b.classList.toggle("is-active", b === btn); });
    render();
  });

  document.getElementById("signOutBtn").addEventListener("click", function () {
    window.blizzoSignOut();
  });

  (async function init() {
    var auth = await window.blizzoRequireRole("admin");
    if (!auth) return; // already redirected

    document.getElementById("userLabel").textContent = auth.profile.full_name || auth.profile.email;

    var res = await window.blizzoSupabase
      .from("enquiries")
      .select("*")
      .order("created_at", { ascending: false });

    if (res.error) {
      document.getElementById("enquiryList").innerHTML =
        '<p class="dash__empty">Couldn\'t load enquiries: ' + escapeHtml(res.error.message) + '</p>';
      return;
    }

    allEnquiries = res.data || [];
    render();
  })();
})();
</script>
</body>
</html>
